'Jonnitto.PrettyEmbedHelper:Mixin.PreserveAspectRatio':
  abstract: true
  properties:
    preserveAspectRatio:
      type: string
      ui:
        label: i18n
        reloadIfChanged: true
        inspector:
          group: look
          position: 25
          hidden: 'ClientEval:node.properties.lightbox && node.properties.prettyembedMetadata && node.properties.prettyembedMetadata.aspectRatio ? false : true'
          editor: Neos.Neos/Inspector/Editors/SelectBoxEditor
          editorOptions:
            allowEmpty: true
            placeholder: i18n
            values:
              fromImage:
                label: i18n
              '16 / 9':
                label: '16:9'
              '4 / 3':
                label: '4:3'
              '1 / 1':
                label: '1:1'
              '9 / 16':
                label: '9:16'
              '3 / 4':
                label: '3:4'
